name: JobNimbus Document Read Probe
# GET-only probe; does not mutate JobNimbus

on:
  push:
    paths:
      - '.github/workflows/jn-doc-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find known PDF and verify binary retrieval (GET only)
        env:
          JOBNIMBUS_API_KEY: ${{ secrets.JOBNIMBUS_API_KEY }}
          TARGET_FILENAME_SHA256: b1c1100d0a29b17b38a67559791f8cb5766635993c832dd00569b4d73f479bfd
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JOBNIMBUS_API_KEY"

          node <<'NODE'
          const crypto = require('crypto');

          const token = process.env.JOBNIMBUS_API_KEY;
          const targetHash = process.env.TARGET_FILENAME_SHA256;
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/json'
          };

          async function getJson(url) {
            const res = await fetch(url, { headers });
            console.log('LIST_HTTP_STATUS=' + res.status);
            if (!res.ok) throw new Error('List request failed: ' + res.status);
            return res.json();
          }

          (async () => {
            let offset = 0;
            const size = 1000;
            let found = null;
            let total = null;

            while (!found) {
              const data = await getJson(
                `https://app.jobnimbus.com/api1/files?from=${offset}&size=${size}`
              );
              const files = Array.isArray(data.files) ? data.files : [];
              if (total === null) total = Number(data.count || 0);
              console.log('PAGE_OFFSET=' + offset + ' PAGE_COUNT=' + files.length + ' TOTAL=' + total);

              found = files.find(file => {
                const name = String(file.filename || '');
                const hash = crypto.createHash('sha256').update(name).digest('hex');
                return hash === targetHash;
              }) || null;

              if (found) break;
              offset += files.length;
              if (!files.length || offset >= total) break;
            }

            if (!found) throw new Error('Target file was not found in JobNimbus metadata.');
            console.log('TARGET_FOUND=yes');
            console.log('TARGET_METADATA_CONTENT_TYPE=' + (found.content_type || 'unknown'));
            console.log('TARGET_METADATA_SIZE=' + (found.size || 0));
            console.log('TARGET_PRIMARY_TYPE=' + (found.primary?.type || 'unknown'));
            console.log('TARGET_RELATED_TYPES=' + [...new Set((found.related || []).map(x => x.type))].join(','));

            const res = await fetch(
              `https://app.jobnimbus.com/files/${encodeURIComponent(found.jnid)}`,
              { headers: { Authorization: `Bearer ${token}` }, redirect: 'follow' }
            );
            const buf = Buffer.from(await res.arrayBuffer());
            console.log('TARGET_DOWNLOAD_HTTP_STATUS=' + res.status);
            console.log('TARGET_DOWNLOAD_CONTENT_TYPE=' + (res.headers.get('content-type') || 'unknown'));
            console.log('TARGET_DOWNLOAD_BYTES=' + buf.length);
            console.log('TARGET_DOWNLOAD_SHA256=' + crypto.createHash('sha256').update(buf).digest('hex'));
            const pdf = buf.subarray(0, 5).toString('ascii') === '%PDF-';
            console.log('TARGET_DOWNLOAD_IS_PDF=' + (pdf ? 'yes' : 'no'));
            if (!res.ok || !pdf) throw new Error('Target did not download as a PDF.');
          })().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          NODE
